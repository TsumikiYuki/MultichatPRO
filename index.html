<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MultiChat Live Pro | @tsumikiYuki</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: #020617;
      color: white;
      display: flex;
      flex-direction: column;
      overflow: hidden; /* Impede o scroll da página inteira */
    }

    /* Cabeçalho e Controles compactos para sobrar espaço */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 15px;
      background: rgba(10,10,30,0.9);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      flex-shrink: 0;
    }

    .logo {
      font-weight: 700;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dev-tag {
      font-size: 10px;
      background: #ff4ecd;
      padding: 2px 6px;
      border-radius: 4px;
      text-decoration: none;
      color: white;
    }

    .controls {
      display: flex;
      gap: 8px;
      padding: 8px 15px;
      background: rgba(255,255,255,0.03);
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .input-group {
      flex: 1;
      display: flex;
      gap: 4px;
      min-width: 200px;
    }

    input {
      flex: 1;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 6px 12px;
      border-radius: 6px;
      color: white;
      outline: none;
      font-size: 13px;
    }

    .btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1);
      color: white;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
    }

    .btn:hover { background: rgba(255,255,255,0.2); }

    /* GRID MÁGICO QUE OCUPA TUDO */
    #grid {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      align-content: stretch;
      justify-content: stretch;
      padding: 5px;
      gap: 5px;
      overflow-y: auto; /* Scroll apenas se houver MUITOS chats */
    }

    .chat-box {
      flex: 1 1 45%; /* Tenta ficar lado a lado */
      min-width: 300px;
      min-height: 300px;
      background: #000;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Se houver apenas 1 chat, ele ocupa 100% */
    .chat-box:only-child {
      flex: 1 1 100%;
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: rgba(255,255,255,0.05);
      font-size: 11px;
    }

    .badge {
      background: #ff4ecd;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: bold;
      margin-left: 5px;
    }

    iframe {
      flex: 1;
      width: 100%;
      border: none;
    }

    footer {
      padding: 5px 15px;
      font-size: 10px;
      opacity: 0.5;
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }

    /* AJUSTES PARA CELULAR */
    @media (max-width: 600px) {
      .input-group {
        min-width: 100%;
      }
      .chat-box {
        flex: 1 1 100%; /* No celular, um embaixo do outro ocupando largura total */
        min-height: 40vh; /* Cada chat ocupa quase metade da tela do celular */
      }
      header {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    MULTICHAT <span style="color:#ff4ecd;">LIVE PRO</span>
    <span class="dev-tag">@tsumikiYuki</span>
  </div>
  <div style="font-size: 11px; color: #ff4ecd;">MODO MOSAICO ATIVO</div>
</header>

<div class="controls">
  <div class="input-group">
    <input id="yt" placeholder="Link YouTube Live">
    <button class="btn" onclick="addYT()">+ YouTube</button>
  </div>
  <div class="input-group">
    <input id="twitch" placeholder="Nome do Canal Twitch">
    <button class="btn" onclick="addTwitch()">+ Twitch</button>
  </div>
</div>

<div id="grid">
  <!-- Chats injetados aqui -->
</div>

<footer>
  <span>v1.2 Fixed Mobile</span>
  <span>By @tsumikiYuki</span>
</footer>

<script>
  function extractYT(url) {
    try {
      if (url.includes('youtube.com/live/')) return url.split('live/')[1].split('?')[0];
      if (url.includes('v=')) return new URL(url).searchParams.get('v');
      return url;
    } catch { return url; }
  }

  function createChat(src, type, name) {
    const grid = document.getElementById('grid');
    const box = document.createElement('div');
    box.className = 'chat-box';

    box.innerHTML = `
      <div class="chat-header">
        <div>
          <strong>${type.toUpperCase()}</strong> | ${name}
          <span class="badge">AO VIVO</span>
        </div>
        <div style="cursor:pointer; padding: 0 5px;" onclick="this.parentElement.parentElement.remove()">✕</div>
      </div>
      <iframe src="${src}" allowfullscreen></iframe>
    `;

    grid.appendChild(box);
  }

  function addYT() {
    const input = document.getElementById('yt');
    const id = extractYT(input.value);
    if (!id) return alert('Link inválido');
    
    const domain = window.location.hostname || "localhost";
    const src = `https://www.youtube.com/live_chat?v=${id}&embed_domain=${domain}&dark_theme=1`;
    
    createChat(src, 'YouTube', id);
    input.value = '';
  }

  function addTwitch() {
    const input = document.getElementById('twitch');
    const channel = input.value.trim().toLowerCase();
    if (!channel) return alert('Digite o canal');

    const domain = window.location.hostname || "localhost";
    const src = `https://www.twitch.tv/embed/${channel}/chat?parent=${domain}&darkpopout`;
    
    createChat(src, 'Twitch', channel);
    input.value = '';
  }
</script>

</body>
</html>
