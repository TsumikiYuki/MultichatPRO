<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MultiChat Live Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #0b0f2a, #020617);
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      transition: 0.3s;
    }

    body.light {
      background: #f1f5f9;
      color: #111;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: rgba(10,10,30,0.6);
      backdrop-filter: blur(14px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
    }

    .logo img {
      width: 34px;
      border-radius: 10px;
    }

    .tabs span {
      margin: 0 10px;
      cursor: pointer;
    }

    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 14px;
      padding: 14px;
    }

    .chat-box {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .chat-box.yt { box-shadow: 0 0 20px rgba(255,0,0,0.4); }
    .chat-box.tw { box-shadow: 0 0 20px rgba(145,70,255,0.4); }
    .chat-box.kick { box-shadow: 0 0 20px rgba(0,255,100,0.4); }

    .chat-header {
      display: flex;
      justify-content: space-between;
      padding: 8px;
      font-size: 12px;
      background: rgba(0,0,0,0.5);
    }

    iframe { width: 100%; height: 100%; border: none; }

    .remove {
      cursor: pointer;
      color: red;
    }

    .panel { display:none; padding:20px; }
    .panel.active { display:block; }

  </style>
</head>
<body>

<header>
  <div class="logo">
    <img src="https://i.imgur.com/ZNLFXUd.png">
    MULTICHAT
  </div>

  <div class="tabs">
    <span onclick="showTab('chats')">Chats</span>
    <span onclick="showTab('config')">Configurações</span>
    <span onclick="showTab('sobre')">Sobre</span>
  </div>

  <button onclick="toggleTheme()">Tema</button>
</header>

<div id="chats" class="panel active">
  <input id="yt" placeholder="Link YouTube">
  <button onclick="addYT()">Add YT</button>

  <input id="twitch" placeholder="Canal Twitch">
  <button onclick="addTwitch()">Add Twitch</button>

  <input id="kick" placeholder="Canal Kick">
  <button onclick="addKick()">Add Kick</button>

  <p style="font-size:12px;opacity:0.7">⚠️ Use o link da barra do navegador do YouTube, não o menu de compartilhar</p>

  <div class="grid" id="grid"></div>
</div>

<div id="config" class="panel">
  <h3>Configurações</h3>
  <p>Mais opções em breve 👀</p>
</div>

<div id="sobre" class="panel">
  <h3>Sobre</h3>
  <p>Sou uma youtuber e escritora que às vezes programa por besteira.</p>
  <p>@tsumikiYuki</p>
</div>

<footer style="text-align:center;padding:10px;font-size:12px;opacity:0.6">
  Feito por TsumikiYuki
</footer>

<script>
function showTab(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function toggleTheme(){
  document.body.classList.toggle('light');
}

function extractYT(url){
  try{ return new URL(url).searchParams.get('v'); }
  catch{ return url; }
}

function getDomain(){ return location.hostname || "localhost"; }

function createChat(src,type,name){
  const box=document.createElement('div');
  box.className='chat-box '+type;

  const header=document.createElement('div');
  header.className='chat-header';

  const title=document.createElement('span');
  title.innerText=name;

  const remove=document.createElement('span');
  remove.innerText='✖';
  remove.className='remove';
  remove.onclick=()=>box.remove();

  header.appendChild(title);
  header.appendChild(remove);

  const iframe=document.createElement('iframe');
  iframe.src=src;

  box.appendChild(header);
  box.appendChild(iframe);

  document.getElementById('grid').appendChild(box);
}

function addYT(){
  const id=extractYT(document.getElementById('yt').value);
  const src=`https://www.youtube.com/live_chat?v=${id}&embed_domain=${getDomain()}`;
  createChat(src,'yt','YouTube');
}

function addTwitch(){
  const c=document.getElementById('twitch').value;
  const src=`https://www.twitch.tv/embed/${c}/chat?parent=${getDomain()}`;
  createChat(src,'tw',c);
}

function addKick(){
  const c=document.getElementById('kick').value;
  const src=`https://kick.com/${c}/chatroom`;
  createChat(src,'kick',c);
}
</script>

</body>
</html>
